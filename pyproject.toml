[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airline-write-gate"
version = "0.1.0"
description = "Checks the writes in tau2-bench airline trajectories against the airline policy, using only what the agent had read by then."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
airline-write-gate = "airline_write_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
airline_write_gate = ["policy.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
